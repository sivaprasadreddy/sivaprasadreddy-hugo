<article class="entry">
  <time class="entry-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Monday, 2 January 2006" }}</time>
  <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p class="entry-summary">{{ .Summary | plainify | truncate 220 }}</p>
</article>
